# Single-node MinIO for local demos and e2e tests. Not for production.
apiVersion: v1
kind: Namespace
metadata:
  name: minio
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: minio
spec:
  replicas: 1
  selector:
    matchLabels: {app: minio}
  template:
    metadata:
      labels: {app: minio}
    spec:
      containers:
        - name: minio
          image: minio/minio:RELEASE.2025-04-22T22-12-26Z
          args: ["server", "/data"]
          env:
            - {name: MINIO_ROOT_USER, value: minioadmin}
            - {name: MINIO_ROOT_PASSWORD, value: minioadmin}
          ports:
            - containerPort: 9000
          readinessProbe:
            httpGet: {path: /minio/health/ready, port: 9000}
            periodSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: minio
spec:
  selector: {app: minio}
  ports:
    - {port: 9000, targetPort: 9000}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: create-bucket
  namespace: minio
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mb
          image: amazon/aws-cli:2.27.0
          command: ["/bin/bash", "-c"]
          args:
            - aws --endpoint-url http://minio.minio.svc:9000 s3 mb s3://pg-backups || aws --endpoint-url http://minio.minio.svc:9000 s3 ls s3://pg-backups
          env:
            - {name: AWS_ACCESS_KEY_ID, value: minioadmin}
            - {name: AWS_SECRET_ACCESS_KEY, value: minioadmin}
            - {name: AWS_DEFAULT_REGION, value: us-east-1}
