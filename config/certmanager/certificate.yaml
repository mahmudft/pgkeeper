apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: selfsigned-issuer
  namespace: system
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: serving-cert
  namespace: system
spec:
  dnsNames:
    - pgkeeper-webhook-service.pgkeeper-system.svc
    - pgkeeper-webhook-service.pgkeeper-system.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: pgkeeper-selfsigned-issuer
  secretName: webhook-server-cert
