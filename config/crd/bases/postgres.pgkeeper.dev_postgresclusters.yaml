              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PostgresClusterSpec defines the desired state of a PostgreSQL
              cluster.
            properties:
              backup:
                description: Backup configuration. Required for scheduled backups
                  and restores.
                properties:
                  historyLimit:
                    default: 5
                    description: Number of finished scheduled PostgresBackup objects
                      to keep in the cluster.
                    format: int32
                    minimum: 1
                    type: integer
                  retentionDays:
                    default: 7
                    description: Delete backup objects in S3 older than this many
