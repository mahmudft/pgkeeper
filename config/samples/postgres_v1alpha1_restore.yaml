# Creates a new cluster from a backup taken from "demo".
# Replace objectKey with the value of `kubectl get pgb demo-manual -o jsonpath='{.status.objectKey}'`.
apiVersion: postgres.pgkeeper.dev/v1alpha1
kind: PostgresCluster
metadata:
  name: demo-restored
spec:
  version: "16"
  instances: 1
  storage:
    size: 1Gi
  database:
    name: shop
    owner: shop
  backup:
    s3:
      endpoint: http://s3.s3.svc:8333
      bucket: pg-backups
      path: pgkeeper
      credentialsSecret:
        name: s3-credentials
  bootstrap:
    fromBackup:
      objectKey: pgkeeper/default/demo/demo-manual.sql.gz
