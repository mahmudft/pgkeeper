apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pgkeeper-system
namePrefix: pgkeeper-
resources:
  - ../crd
  - ../rbac
  - ../manager
  - ../webhook
  - ../certmanager
patches:
  - path: manager_webhook_patch.yaml
  - path: webhook_ca_patch.yaml
    target:
      kind: ValidatingWebhookConfiguration
