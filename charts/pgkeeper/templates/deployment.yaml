apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pgkeeper.fullname" . }}
  labels:
    {{- include "pgkeeper.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "pgkeeper.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pgkeeper.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "pgkeeper.fullname" . }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
            - --zap-log-level={{ .Values.logLevel }}
            - --postgres-image={{ .Values.images.postgres }}
            - --exporter-image={{ .Values.images.exporter }}
            - --tools-image={{ .Values.images.tools }}
            {{- if .Values.leaderElection }}
            - --leader-elect
            {{- end }}
          env:
            - name: ENABLE_WEBHOOKS
              value: {{ .Values.webhook.enabled | quote }}
          ports:
            - name: metrics
              containerPort: 8080
            {{- if .Values.webhook.enabled }}
            - name: webhook
              containerPort: 9443
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          {{- if .Values.webhook.enabled }}
          volumeMounts:
            - name: cert
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
          {{- end }}
      {{- if .Values.webhook.enabled }}
      volumes:
        - name: cert
          secret:
            secretName: {{ include "pgkeeper.fullname" . }}-webhook-cert
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 10
