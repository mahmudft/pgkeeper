image:
  repository: ghcr.io/mahmudft/pgkeeper
  # Defaults to the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 1
leaderElection: true

# Images used for managed workloads.
images:
  postgres: postgres
  exporter: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
  tools: amazon/aws-cli:2.27.0

webhook:
  # Requires cert-manager in the cluster.
  enabled: true

metrics:
  serviceMonitor:
    # Requires the Prometheus Operator CRDs.
    enabled: false
    interval: 30s

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 256Mi

logLevel: info

nodeSelector: {}
tolerations: []
affinity: {}
